repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=700]
      - id: check-merge-conflict
      # Pairs with `* text=auto eol=lf` in .gitattributes: catch a stray CRLF
      # at commit time rather than as a whole-file diff later.
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # A metric in semantic/metrics.yml that references a column the
      # warehouse does not have fails silently at query time, as a wrong
      # number rather than an error. Cheapest to catch in the commit that
      # causes it.
      - id: registry-agrees-with-warehouse
        name: metric registry agrees with the warehouse schema
        entry: uv run --frozen --extra dev python -m semantic_layer.registry --check
        language: system
        pass_filenames: false
        files: ^(semantic/metrics\.yml|src/semantic_layer/gen\.py)$
